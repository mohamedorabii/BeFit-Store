version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: befit_app
    restart: unless-stopped
    working_dir: /var/www
    user: "1000:1000"
    volumes:
      - .:/var/www
    depends_on:
      - db
      - redis
    networks:
      - befit

  webserver:
    image: nginx:alpine
    container_name: befit_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - befit

  db:
    image: mysql:8.0
    container_name: befit_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: befit
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: befit
      MYSQL_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - befit

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: befit_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - befit

  redis:
    image: redis:7-alpine
    container_name: befit_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - befit

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: befit_meilisearch
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    networks:
      - befit

  mailpit:
    image: axllent/mailpit
    container_name: befit_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - befit

networks:
  befit:
    driver: bridge

volumes:
  dbdata:
  meili_data: